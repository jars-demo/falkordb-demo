[project]
name = "falkordb-demo"
version = "0.1.0"
description = "A hands-on workshop app for FalkorDB: model data as a graph, query it with Cypher, then try GraphRAG."
readme = "README.md"
requires-python = ">=3.10,<3.14"
# Direct dependencies are pinned exactly, so every attendee runs the same versions.
# requirements.txt pins the full dependency tree for pip users (generated from uv.lock).
dependencies = [
    "falkordb==1.7.1",
    "graphrag-sdk[litellm]==1.4.0",
    "fastembed==0.8.1",
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "python-dotenv==1.2.4",
    # Not used directly: listed so [tool.uv.sources] can take it from the CPU-only index (below).
    "torch==2.14.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
    "ruff==0.16.10",
]

[tool.uv]
package = false

# graphrag-sdk depends on gliner, which depends on torch. On Linux, PyPI's torch is the CUDA build
# with gigabytes of nvidia-* packages; nothing here needs a GPU, so take torch from PyTorch's
# CPU-only index on every platform.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
